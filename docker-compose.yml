services:
  traccar-billing:
    build: .
    ports:
      - "8083:8083"
    environment:
      HTTP_PORT: "8083"
      DB_DRIVER: mysql
      DATABASE_URL: "billing:billing@tcp(mysql:3306)/traccar_billing?parseTime=true"
      SYNC_INTERVAL: "15m"
      TIMEZONE: "UTC"
      SESSION_SECRET: "change-me-to-a-real-random-32-byte-hex-value"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: traccar_billing
      MYSQL_USER: billing
      MYSQL_PASSWORD: billing
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
